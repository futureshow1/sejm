<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sejm Symulator — dostęp</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#0c1018,#050810);font-family:-apple-system,'Inter',sans-serif;color:#e5e7eb}
  .box{max-width:360px;width:90%;text-align:center}
  .flag{width:34px;height:22px;border:1px solid #555;margin:0 auto 18px;display:flex;flex-direction:column}
  .flag i{flex:1}.flag i:first-child{background:#f4f5f7}.flag i:last-child{background:#c8102e}
  h1{font-size:22px;font-weight:700;margin:0 0 6px}
  p{font-size:13px;color:#9aa0a8;margin:0 0 22px;line-height:1.5}
  input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #333;border-radius:6px;
    background:#11151d;color:#e5e7eb;font-size:15px;text-align:center;letter-spacing:.06em}
  input:focus{outline:2px solid #c8102e;border-color:#c8102e}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:6px;background:#c8102e;
    color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#a30d26}
  .err{color:#f87171;font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<div class="box">
  <div class="flag"><i></i><i></i></div>
  <h1>Sejm Symulator</h1>
  <p>Wersja robocza — dostęp po podaniu hasła.</p>
  <form id="f"><input id="pw" type="password" placeholder="hasło" autofocus autocomplete="off">
  <button type="submit">Wejdź</button><div class="err" id="err"></div></form>
</div>
<script>
const HASH="d506f1b659084d73bd3dfcdc7c0a13c45bd27c8227a7063ff606da1a431fccdd";
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const h=await sha256(document.getElementById("pw").value.trim());
  if(h===HASH){try{sessionStorage.setItem("sejm_gate",h)}catch(e){}
    let n=new URLSearchParams(location.search).get("next")||"/sejm/";
    if(!n.startsWith("/sejm")) n="/sejm/";
    location.replace(n);
  }else{document.getElementById("err").textContent="Nieprawidłowe hasło";
    document.getElementById("pw").value="";}
});
</script></body></html>
